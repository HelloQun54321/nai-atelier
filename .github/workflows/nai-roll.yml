name: nai-roll

# 一键 Roll 的「产物片段 ↔ 源码服务」一致性门禁。
# 这套检查不依赖已安装应用、不需要网络与真实数据：
#   1) 类型 + 构建：确认源码侧没有类型/打包回归；
#   2) 工具脚本语法自检：补丁与验收脚本本身是纯 ESM，逐个 node --check；
#   3) 组件、草稿、请求及源码服务回归，另做产物片段与源码服务的语义一致性比对。
# 需要已安装应用 + CDP 浏览器的端到端套件（tools/nai-roll/testenv）仍是手工验收，不在此运行。

on:
  push:
    paths:
      - 'services/contentRoll*.ts'
      - 'services/labWorkspace.ts'
      - 'components/ContentRoll*.tsx'
      - 'components/ChainEditor.tsx'
      - 'components/chain/ChainEditorPromptInputs.tsx'
      - 'components/promptLibraryConfig.ts'
      - 'components/PromptLibrary*.tsx'
      - 'PROJECT_AGENT.md'
      - 'tools/nai-roll/**'
      - 'tests/services/contentRoll*.test.ts'
      - 'tests/components/ChainEditor.workspace.test.tsx'
      - 'tests/integration/naiRollParity.test.ts'
      - 'types.ts'
      - '.github/workflows/nai-roll.yml'
  pull_request:
    paths:
      - 'services/contentRoll*.ts'
      - 'services/labWorkspace.ts'
      - 'components/ContentRoll*.tsx'
      - 'components/ChainEditor.tsx'
      - 'components/chain/ChainEditorPromptInputs.tsx'
      - 'components/promptLibraryConfig.ts'
      - 'components/PromptLibrary*.tsx'
      - 'PROJECT_AGENT.md'
      - 'tools/nai-roll/**'
      - 'tests/services/contentRoll*.test.ts'
      - 'tests/components/ChainEditor.workspace.test.tsx'
      - 'tests/integration/naiRollParity.test.ts'
      - 'types.ts'
      - '.github/workflows/nai-roll.yml'
  workflow_dispatch:

concurrency:
  group: nai-roll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建（tsc + vite + worker）
        run: npm run build

      - name: 工具脚本语法自检
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files 'tools/nai-roll/**/*.mjs')
          if [ -z "$files" ]; then echo "没有找到 tools/nai-roll 下的脚本"; exit 1; fi
          count=0
          for file in $files; do
            node --check "$file"
            count=$((count + 1))
          done
          echo "已检查 $count 个脚本"

      - name: 一键 Roll 与实验室回归
        run: npm run test -- tests/services/contentRoll.test.ts tests/services/contentRollDraw.test.ts tests/services/contentRollApply.test.ts tests/services/characterPrompts.test.ts tests/services/labWorkspace.test.ts tests/services/naiPayload.test.ts tests/services/naiService.test.ts tests/services/promptApply.test.ts tests/services/promptSections.test.ts tests/services/promptTagFilter.test.ts tests/services/promptProvenance.test.ts tests/services/promptAgentRetry.test.ts tests/services/operationId.test.ts tests/components/ContentRollWorkspace.test.tsx tests/components/PromptLibraryPicker.test.tsx tests/components/ChainEditor.workspace.test.tsx tests/integration/App.externalChain.test.tsx

      - name: 六类库与助手回归
        run: npm run test:node -- tests/scripts/prompt-library.test.mjs tests/scripts/prompt-agent.test.mjs

      - name: 产物片段与源码服务一致性
        run: npm run test -- tests/integration/naiRollParity.test.ts
