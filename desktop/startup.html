<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
  <title>NAI Atelier</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, 'Microsoft YaHei', sans-serif; background: #14171f; color: #edf0f5; }
    body { margin: 0; display: grid; min-height: 100vh; place-items: center; }
    main { width: min(440px, calc(100vw - 64px)); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .brand-icon { width: 42px; height: 42px; flex: none; }
    h1 { font-size: 26px; font-weight: 650; margin: 0; }
    p { color: #a6b0c5; line-height: 1.7; overflow-wrap: anywhere; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5bbfe8; margin-right: 10px; animation: breathe 1.4s ease-in-out infinite; }
    [data-phase=error] .dot { background: #ef8686; animation: none; }
    button { border: 1px solid #384256; background: #202633; color: inherit; border-radius: 7px; padding: 10px 16px; margin: 14px 8px 0 0; cursor: pointer; }
    button:hover { background: #2b3547; } button:focus-visible { outline: 2px solid #5bbfe8; outline-offset: 3px; }
    /* 无边框标题栏（macOS）下整页可拖动窗口，按钮保持可点。 */
    body { -webkit-app-region: drag; } button { -webkit-app-region: no-drag; }
    [hidden] { display: none; }
    @keyframes breathe { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    @media (prefers-color-scheme: light) { :root { background: #f7f8fb; color: #253047; } p { color: #657088; } button { background: #fff; border-color: #d1d8e5; } button:hover { background: #edf1f7; } }
  </style>
</head>
<body>
  <main data-phase="starting">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 256 256" role="img" aria-label="NAI Atelier 图标" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="45%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
          <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="rgba(255,255,255,0.5)"/><stop offset="100%" stop-color="rgba(255,255,255,0.15)"/></linearGradient>
          <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="rgba(3,105,161,0.45)"/></filter>
        </defs>
        <rect x="18" y="18" width="220" height="220" rx="54" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>
        <path d="M22 72 C22 42, 42 22, 72 22 L184 22 C214 22, 234 42, 234 72 L234 110 C180 95, 76 95, 22 110 Z" fill="rgba(255,255,255,0.08)"/>
        <g filter="url(#glyphShadow)" transform="translate(128, 128) scale(5.8) translate(-12, -12)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/>
          <circle cx="13.5" cy="6.5" r=".6" fill="#fff"/><circle cx="17.5" cy="10.5" r=".6" fill="#fff"/><circle cx="6.5" cy="12.5" r=".6" fill="#fff"/><circle cx="8.5" cy="7.5" r=".6" fill="#fff"/>
        </g>
      </svg>
      <h1>NAI Atelier</h1>
    </div>
    <p role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="message">正在打开工坊…</span></p>
    <div id="actions" hidden><button id="retry">重新尝试</button><button id="logs">查看日志</button><button id="quit">退出</button></div>
  </main>
  <script src="startup.js"></script>
</body>
</html>
