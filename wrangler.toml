name = "nai-prompt-manager"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# 本地个人模式：wrangler pages dev 仅按 binding 名与 database_name / bucket_name
# 在 --persist-to 目录中生成本地模拟存储，不需要云端资源 ID。
[[d1_databases]]
binding = "DB"
database_name = "nai-db"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "nai-assets"