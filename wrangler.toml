name = "nai-prompt-manager"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# D1 本地存储键 = f(database_name + database_id)：此 ID 决定 --persist-to 下加载
# 哪一个 SQLite 文件。请勿删除或更改，否则本地模式会改加载全新的空库。
[[d1_databases]]
binding = "DB"
database_name = "nai-db"
database_id = "04b0c4f6-8b3b-4e1d-a880-2dfe4f7d75f7"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "nai-assets"